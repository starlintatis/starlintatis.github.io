<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Starlin Tatis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--bg:#fff;--lw:290px;--serif:'Cormorant Garamond',Georgia,serif}
body{font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{text-decoration:none;color:var(--ink);cursor:pointer}
a:hover{opacity:0.45}

.shell{display:grid;grid-template-columns:var(--lw) 1fr;min-height:100vh}

/* LEFT SIDEBAR */
.left{padding:28px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:28px}
.nav a{font-size:13px;line-height:2.1;font-weight:400}
.nav a.active{font-weight:700}
.ann{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.55;opacity:.5}
.artist{margin-top:auto;font-size:2rem;font-weight:700;line-height:1.05;letter-spacing:-0.02em;padding-top:24px;cursor:pointer}

/* RIGHT */
.right{min-height:100vh}
.right-inner{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* HOME hero */
.hero-img{width:100%;height:100vh;background:#e8e8e8;overflow:hidden;position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,0,0,.3)}

/* CONTENT pages */
.content{padding:32px 40px 80px}
.page-title{font-size:1.1rem;font-weight:400;margin-bottom:36px;letter-spacing:.01em}

/* WORKS grid */
.works-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.work-item{display:block;background:#fff;cursor:pointer}
.work-item img{width:100%;display:block;transition:opacity .3s;background:#fff}
.work-item:hover img{opacity:.75}
.wg-ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.25);letter-spacing:.08em;text-transform:uppercase;padding:8px;text-align:center}

/* WORK DETAIL */
.work-artist{font-family:var(--serif);font-size:1.55rem;font-weight:600;line-height:1.2;margin-bottom:4px;letter-spacing:.01em}
.work-title{font-family:var(--serif);font-size:1.35rem;font-style:italic;font-weight:400;color:#888;margin-bottom:18px}
.work-meta{font-size:13px;line-height:1.9;margin-bottom:6px;color:#888}
.work-edition{display:flex;align-items:center;gap:6px;font-size:13px;color:#888;margin-top:2px;margin-bottom:24px}
.work-edition svg{opacity:.6}
.work-nav{display:flex;gap:20px;margin-bottom:36px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.inq-btn{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;opacity:.65}
.inq-btn:hover{opacity:1}
.work-img{max-width:480px;margin:0 auto}
.work-img img{width:100%;display:block}

/* ABOUT */
.about-photo{margin-bottom:40px}
.about-photo img{width:100%;max-width:620px;display:block}
.about-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 14px;opacity:.5}
.about-body{font-size:13.5px;line-height:1.75;max-width:60ch;margin-bottom:18px}

/* PRINTS INFO */
.prints-section{margin-bottom:32px}
.prints-feature{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.prints-feature li{font-size:13.5px;line-height:1.75;list-style:none;padding-left:14px;position:relative;max-width:60ch}
.prints-feature li::before{content:'·';position:absolute;left:0}
.paper-block{padding-top:14px;margin-bottom:14px;max-width:60ch}
.paper-name{font-size:13.5px;font-weight:700;margin-bottom:4px}
.paper-desc{font-size:13px;line-height:1.7}

/* CONTACT */
.contact-h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 14px;opacity:.5}
.contact-block{margin-bottom:36px}
.contact-block p{font-size:13.5px;line-height:1.9}
.contact-block a{display:block;font-size:13.5px;line-height:2}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{grid-template-columns:1fr}
  .left{position:relative;height:auto;padding:16px 20px 12px;flex-direction:column;gap:10px}
  .nav{flex-direction:row;gap:16px;margin-bottom:0;flex-wrap:wrap}
  .nav a{font-size:12px;line-height:1.6}
  .ann{display:none}
  .artist{display:none}
  .hero-img{height:65vw}
  .works-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px 16px 48px}
}
</style>
</head>
<body>

<div class="shell">

  <!-- LEFT SIDEBAR -->
  <div class="left">
    <nav class="nav" id="nav">
      <a onclick="go('works')" data-p="works">Works</a>
      <a onclick="go('about')" data-p="about">About</a>
      <a onclick="go('prints')" data-p="prints">Editions</a>
      <a onclick="go('contact')" data-p="contact">Contact</a>
    </nav>
    <div class="ann">
      <a href="mailto:starlintatis@gmail.com">Available for commissions</a>
    </div>
    <div class="artist" onclick="go('works')">Starlin Tatis</div>
  </div>

  <!-- RIGHT CONTENT -->
  <div class="right" id="right"></div>

</div>

<script>
// ============================================================
// WORKS — agrega tus fotos aquí
// Cada entrada tiene:
//   id:       identificador único (sin espacios)
//   src:      ruta a la imagen, ej: 'images/nombre.jpg'
//   title:    título de la obra
//   material: tipo de impresión
//   size:     dimensiones, ej: '8 × 11"'
// ============================================================
const WORKS = [
  {
    id: 'work-1',
    src: 'images/work-1.jpg',
    title: 'Untitled No. 03',
    material: 'Digital Silver Gelatin Fiber Gloss',
    size: '11 x 17" 1/2 in',
    sizeCm: '27.9 × 44.5 cm 1.3 cm'
  },
  {
    id: 'work-2',
    src: 'images/work-2.jpg',
    title: 'Untitled No. 02',
    material: 'Digital Silver Gelatin Fiber Gloss',
    size: '11 x 17" 1/2 in',
    sizeCm: '27.9 × 44.5 cm 1.3 cm'
  },
  {
    id: 'work-3',
    src: 'images/work-3.jpg',
    title: 'Untitled (Test)',
    material: 'Digital Silver Gelatin Fiber Gloss',
    size: '16.8 x 26.8" 1/2 in',
    sizeCm: '42.7 × 68.1 cm 1.3 cm'
  },
  // Para agregar más obras, copia el bloque de arriba y pégalo aquí
  // separado por una coma
];

// ============================================================
// CONTACT
// ============================================================
const CONTACT = {
  email: 'starlintatis@gmail.com',
  location: 'Santo Domingo, Dominican Republic',
  social: [
    { name: 'Instagram', link: 'https://instagram.com/starlintatis' },
  ],
  note: 'For print inquiries, exhibition proposals, and editorial commissions.'
};

// ============================================================
// ROUTING — no editar debajo de esta línea
// ============================================================
let state = { page: 'works', workId: null };

function go(page, id) {
  state = { page, workId: page === 'work-detail' ? id : null };
  render();
  window.scrollTo(0, 0);
}

function setActive(p) {
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.p === p);
  });
}

function render() {
  const R = document.getElementById('right');
  const { page, workId } = state;

  // WORKS LIST
  if (page === 'works') {
    setActive('works');
    const grid = WORKS.map(w => `
      <div class="work-item" onclick="go('work-detail','${w.id}')">
        <img src="${w.src}" alt="${w.title}"
          onerror="this.outerHTML='<div class=wg-ph>${w.title}</div>'"/>
      </div>`
    ).join('');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="works-grid">${grid}</div>
      </div>
      </div>`;
    return;
  }

  // WORK DETAIL
  if (page === 'work-detail') {
    setActive('works');
    const w = WORKS.find(x => x.id === workId) || WORKS[0];
    const i = WORKS.indexOf(w);
    const prev = WORKS[i - 1];
    const next = WORKS[i + 1];
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="work-nav">
          ${prev ? `<a onclick="go('work-detail','${prev.id}')">← Prev</a>` : ''}
          <a onclick="go('works')">All works</a>
          ${next ? `<a onclick="go('work-detail','${next.id}')">Next →</a>` : ''}
        </div>
        <div class="work-img">
          <img src="${w.src}" alt="${w.title}"/>
        </div>
        <div style="margin-top:24px">
          <div class="work-artist">Starlin Tatis</div>
          <div class="work-title">${w.title}</div>
          <div class="work-meta">
            ${w.material}<br>
            ${w.size} | ${w.sizeCm}
          </div>
          <div class="work-edition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="1"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg>
            Part of a limited edition
          </div>
          <a class="inq-btn" href="mailto:starlintatis@gmail.com?subject=Inquiry: ${w.title}">Inquiries</a>
        </div>
      </div>
      </div>`;
    return;
  }

  // ABOUT
  if (page === 'about') {
    setActive('about');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="about-photo">
          <img src="images/about.jpg" alt="Starlin Tatis"
            onerror="this.parentNode.style.display='none'"/>
        </div>
        <div class="about-h">About</div>
        <p class="about-body">Starlin Tatis es un fotógrafo autodidacta y director creativo radicado en Santo Domingo, República Dominicana. Su práctica, situada en el cruce entre el retrato editorial y la fotografía de moda, desde 2010, viene definiéndose por una atención sostenida a la presencia, el silencio entre el sujeto y el lente que transforma una fotografía en algo más cercano, un registro único y memorable.</p>
        <p class="about-body">Sin formación académica formal en gran porcentaje, construyó su lenguaje visual a través de un compromiso inquebrantable con el oficio del artista, desarrollando una práctica sustentada en la precisión formal y la profundidad psicológica; tomando las artes escénicas como casi su total inspiración en moda. Su estética bebe de las tradiciones del retrato artístico y los códigos de la moda contemporánea, moldeada enteramente por la disciplina de la observación y la creación constante, rechazando el espectáculo en favor de la quietud.</p>
        <p class="about-body">Su obra ha sido expuesta internacionalmente en CONTEXT Art Miami y Art Basel Miami Beach, dos de las plataformas más relevantes del arte contemporáneo en las Américas, así como en el TRImarchi Graphic Design Festival en Mar del Plata, Argentina, y la Galería Espacio Falso en Santiago de Chile. Ha sido publicada en Inkult Magazine (Ciudad de México), BALAM Magazine (Buenos Aires), Bass Culture Islands, Oh! Magazine y Pandora Magazine, y seleccionada para PhotoVogue, la plataforma de Vogue Italia dedicada al talento fotográfico emergente a nivel mundial. Sus fotografías forman parte de colecciones privadas en varios continentes.</p>

      </div>
      </div>`;
    return;
  }

  // PRINTS INFO
  if (page === 'prints') {
    setActive('prints');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="prints-section">
          <p class="about-body">Todas las fotografías se imprimen bajo pedido en papel Archival Rag de fibra de algodón o utilizando el aclamado proceso Digital Silver Gelatin sobre auténtico papel de Haluro de plata. El proceso Digital Silver Gelatin son impresiones fotográficas de verdadero blanco y negro producidas directamente desde archivos digitales mediante tecnología láser, utilizando haluros de plata como medio de imagen.</p>
          <p class="about-body">Una impresora láser LightJet 430 expone papel Ilford Silver Gelatin sensible a la luz, que posteriormente se procesa en fotoquímicos, combinando la precisión digital contemporánea con la riqueza tonal y la permanencia del revelado en cuarto oscuro.</p>
          <p class="about-body">Dado que la imagen se forma con plata en lugar de tinta, las impresiones están permanentemente libres de virados de color y mantienen una consistencia visual excepcional a lo largo del tiempo. Los materiales Silver Gelatin son también naturalmente resistentes a la humedad, las huellas dactilares y el desvanecimiento por exposición prolongada a la luz.</p>
          <p class="about-body"><strong>Se ofrecen dos papeles Silver Gelatin:</strong></p>
          <div class="paper-block">
            <div class="paper-name">Fiber Gloss (Baryta Coated)</div>
            <p class="paper-desc">Calidad premium en Silver Gelatin sobre Baryta Coated Fiber Base 310gsm. El referente absoluto en impresión de bellas artes en blanco y negro. Tonos ricos y acentuados, excelente contraste y todas las hermosas características que ofrece este acabado.</p>
          </div>
          <div class="paper-block">
            <div class="paper-name">RC Pearl</div>
            <p class="paper-desc">Verdadero Silver Gelatin Resin (RC) 190gsm, papel Ilford Pearl con acabado similar a una base lustre. Ideal para entornos exigentes y manipulación frecuente, sin sacrificar ninguna de las cualidades estéticas propias de un Silver Gelatin print.</p>
          </div>
        </div>

        <div class="prints-section">
          <div class="about-h">Tamaños desde</div>
          <p class="about-body">5x7" · 8×10" · 11×14/17" · 16×20" · 20×24"</p>
          <p class="about-body" style="font-style:italic;opacity:.65">Dimensiones y tipo de papel personalizadas bajo pedido.</p>
        </div>

        <div class="prints-section">
          <div class="about-h">Pedidos</div>
          <p class="about-body">Las impresiones son ediciones limitadas que se imprimen bajo pedido (sin enmarcar). Todas las impresiones incluyen un borde blanco.</p>
          <p class="about-body">Todos los pedidos dentro de EE. UU. se envían a través de UPS Ground o del Servicio Postal de Estados Unidos (USPS). Los plazos de envío estimados están sujetos a pequeños cambios. Dado que cada pedido es diferente, empaquetamos cada uno de ellos para proteger mejor sus imágenes. De 5 a 7 días laborables. Las impresiones sobre papel de fibra pueden tardar de 7 a 10 días debido al proceso, lavado de archivo y al secado al aire.</p>
        </div>
      </div>
      </div>`;
    return;
  }

  // CONTACT
  if (page === 'contact') {
    setActive('contact');
    const socialHtml = CONTACT.social.map(s =>
      `<a href="${s.link}">${s.name}</a>`).join('');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="contact-block">
          <div class="contact-h">Contact</div>
          <p class="about-body" style="margin-bottom:8px">${CONTACT.note}</p>
          <a href="mailto:${CONTACT.email}">${CONTACT.email}</a>
        </div>
        <div class="contact-block">
          <div class="contact-h">Location</div>
          <p>${CONTACT.location}</p>
        </div>
        ${CONTACT.social.length ? `
        <div class="contact-block">
          <div class="contact-h">Social</div>
          ${socialHtml}
        </div>` : ''}
      </div>
      </div>`;
    return;
  }
}

render();
</script>
</body>
</html>
