<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Starlin Tatis</title>

<!-- Conexión e Inyección oficial de Clash Grotesk con todos sus pesos y cursivas -->
<link href="https://fontshare.com[]=clash-grotesk@200,201,300,301,400,401,500,501,600,601,700,701&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--bg:#fff;--lw:290px;--serif:'Clash Grotesk',sans-serif}
body{font-family:'Clash Grotesk',sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
a{text-decoration:none;color:var(--ink);cursor:pointer}
a:hover{opacity:0.45}

.shell{display:grid;grid-template-columns:var(--lw) 1fr;height:100vh}

/* LEFT SIDEBAR — fixed, never scrolls */
.left{padding:28px;display:flex;flex-direction:column;height:100vh;overflow:hidden;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:28px}
.nav a{font-size:13px;line-height:2.1;font-weight:700}
.nav a.active{opacity:0.45}
.ann{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.55;opacity:.5}
.artist{order:99;margin-top:auto;font-size:2rem;font-weight:700;line-height:1.05;letter-spacing:-0.02em;padding-top:24px;cursor:pointer}

/* RIGHT — this column scrolls */
.right{height:100vh;overflow-y:auto}
.right-inner{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* CONTENT pages */
.content{padding:32px 40px 80px}
.page-title{font-size:1.1rem;font-weight:400;margin-bottom:36px;letter-spacing:.01em}

/* WORKS grid — hover effect mejorado */
.works-grid{display:grid;grid-template-columns:260px 260px;gap:240px 200px;padding:120px 32px 200px;justify-content:center}
.work-item{display:flex;flex-direction:column;gap:14px;cursor:pointer;position:relative}
.work-item .img-wrap{position:relative;display:block}
.work-item .img-wrap::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .35s ease;pointer-events:none}
.work-item:hover .img-wrap::after{background:rgba(0,0,0,0.5)}
.work-item img{width:100%;height:auto;display:block;transition:opacity .35s ease}
.work-item-title{font-family:'Clash Grotesk',sans-serif;font-size:1rem;font-style:italic;font-weight:400;color:#888;margin-bottom:3px}
.work-item-info{font-size:11px;color:#888;line-height:1.7}
.wg-ph{width:260px;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.25);letter-spacing:.08em;text-transform:uppercase;padding:8px;text-align:center;background:#f2f2f2}

/* WORK DETAIL — navegación con fuente más pequeña */
.work-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;padding-bottom:16px;border-bottom:1px solid #eee}
.work-nav-group{display:flex;gap:28px}
.work-nav a{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;color:#999;transition:color .2s ease}
.work-nav a:hover{color:#111;opacity:1}
.work-nav .nav-prev, .work-nav .nav-next{font-size:10px}
.work-artist{font-family:'Clash Grotesk',sans-serif;font-size:1.55rem;font-weight:400;font-style:normal;line-height:1.2;margin-bottom:4px;letter-spacing:.01em}
.work-title{font-family:'Clash Grotesk',sans-serif;font-size:1.35rem;font-style:italic;font-weight:400;color:#888;margin-bottom:18px}
.work-meta{font-size:13px;line-height:1.9;margin-bottom:6px;color:#888}
.sold-tag{color:#aaa;font-size:10px;letter-spacing:.06em;font-family:inherit}
.work-edition{display:flex;align-items:center;gap:6px;font-size:13px;color:#888;margin-top:2px;margin-bottom:24px}
.work-edition svg{opacity:.6}
.inq-btn{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;opacity:.65;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:'Clash Grotesk',sans-serif;color:var(--ink)}
.inq-btn:hover{opacity:1}
.work-img{max-width:480px;margin:0 auto}
.work-img img{width:100%;display:block}

/* INQUIRY MODAL */
.inq-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.inq-modal{background:#fff;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;padding:40px;position:relative}
.inq-close{position:absolute;top:16px;right:20px;font-size:18px;cursor:pointer;opacity:.4;background:none;border:none;font-family:inherit;color:#111;line-height:1}
.inq-close:hover{opacity:1}
.inq-modal-header{display:flex;gap:20px;margin-bottom:32px;align-items:flex-start}
.inq-thumb{width:72px;flex-shrink:0}
.inq-thumb img{width:100%;display:block}
.inq-thumb-ph{width:72px;height:90px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa;text-align:center;letter-spacing:.05em;text-transform:uppercase}
.inq-work-info{}
.inq-work-title{font-family:'Clash Grotesk',sans-serif;font-size:1.1rem;font-style:italic;color:#888;margin-bottom:4px}
.inq-work-meta{font-size:11px;color:#aaa;line-height:1.7}
.inq-form-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;color:#111}
.inq-field{margin-bottom:16px}
.inq-field label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#999;margin-bottom:5px}
.inq-field input,.inq-field textarea{width:100%;border:none;border-bottom:1px solid #ddd;padding:6px 0;font-size:13px;font-family:'Clash Grotesk',sans-serif;color:#111;outline:none;background:transparent;transition:border-color .2s}
.inq-field input:focus,.inq-field textarea:focus{border-bottom-color:#111}
.inq-field textarea{resize:vertical;min-height:90px}
.inq-submit{margin-top:28px;display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:'Clash Grotesk',sans-serif;color:#111;opacity:.65}
.inq-submit:hover{opacity:1}
@media(max-width:768px){.inq-modal{padding:28px 20px;width:95%}}

/* ABOUT */
.about-photo{margin-bottom:40px}
.about-photo img{width:100%;max-width:620px;display:block}
.about-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;opacity:1;color:#111}
.about-body{font-size:13.5px;line-height:1.75;max-width:60ch;margin-bottom:18px}

/* PRINTS INFO */
.prints-section{margin-bottom:32px}
.prints-feature{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.prints-feature li{font-size:13.5px;line-height:1.75;list-style:none;padding-left:14px;position:relative;max-width:60ch}
.prints-feature li::before{content:'·';position:absolute;left:0}
.paper-block{padding-top:14px;margin-bottom:14px;max-width:60ch}
.paper-name{font-size:13.5px;font-weight:700;margin-bottom:4px}
.paper-desc{font-size:13px;line-height:1.7}

/* CONTACT */
.contact-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;opacity:1;color:#111}
.contact-block{margin-bottom:36px}
.contact-block p{font-size:13.5px;line-height:1.9}
.contact-block a{display:block;font-size:13.5px;line-height:2}

/* LANG TOGGLE */
.lang-toggle{display:flex;gap:4px;align-items:center;font-size:9px;letter-spacing:.06em;margin-bottom:16px}
.lang-toggle button{background:none;border:none;padding:0;font-size:9px;letter-spacing:.06em;cursor:pointer;color:var(--ink);opacity:.35;font-family:'Clash Grotesk',sans-serif}
.lang-toggle button.lang-active{opacity:1;font-weight:700}
.lang-toggle button:hover{opacity:.7}
.lang-toggle span{opacity:.25}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}
  .left{height:auto;padding:16px 20px 10px;flex-direction:column;gap:0;overflow:hidden;flex-shrink:0}
}
</style>
</head>
<body>
  <!-- El resto del contenido de tu cuerpo (body) va aquí exactamente igual -->
</body>
</html>
