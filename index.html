<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--bg:#fff;--lw:290px;--serif:'Cormorant Garamond',Georgia,serif}
body{font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
a{text-decoration:none;color:var(--ink);cursor:pointer}
a:hover{opacity:0.45}

.shell{display:grid;grid-template-columns:var(--lw) 1fr;height:100vh}

/* LEFT SIDEBAR — fixed, never scrolls */
.left{padding:28px;display:flex;flex-direction:column;height:100vh;overflow:hidden;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:28px}
.nav a{font-size:13px;line-height:2.1;font-weight:400}
.nav a.active{opacity:0.45}
.ann{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.55;opacity:.5}
.artist{order:99;margin-top:auto;font-size:2rem;font-weight:700;line-height:1.05;letter-spacing:-0.02em;padding-top:24px;cursor:pointer}

/* RIGHT — this column scrolls */
.right{height:100vh;overflow-y:auto}
.right-inner{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* CONTENT pages */
.content{padding:32px 40px 80px}
.page-title{font-size:1.1rem;font-weight:400;margin-bottom:36px;letter-spacing:.01em}

/* WORKS grid — hover effect mejorado */
.works-grid{display:grid;grid-template-columns:260px 260px;gap:240px 200px;padding:120px 32px 200px;justify-content:center}
.work-item{display:flex;flex-direction:column;gap:14px;cursor:pointer;position:relative}
.work-item .img-wrap{position:relative;display:block}
.work-item .img-wrap::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .35s ease;pointer-events:none}
.work-item:hover .img-wrap::after{background:rgba(0,0,0,0.5)}
.work-item img{width:100%;height:auto;display:block;transition:opacity .35s ease}
.work-item-title{font-family:Baskerville,'Baskerville Old Face','Libre Baskerville',Georgia,serif;font-size:1rem;font-style:italic;font-weight:400;color:#888;margin-bottom:3px}
.work-item-info{font-size:11px;color:#888;line-height:1.7}
.wg-ph{width:260px;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.25);letter-spacing:.08em;text-transform:uppercase;padding:8px;text-align:center;background:#f2f2f2}

/* WORK DETAIL — navegación con fuente más pequeña */
.work-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;padding-bottom:16px;border-bottom:1px solid #eee}
.work-nav-group{display:flex;gap:28px}
.work-nav a{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;color:#999;transition:color .2s ease}
.work-nav a:hover{color:#111;opacity:1}
.work-nav .nav-prev, .work-nav .nav-next{font-size:10px}
.work-artist{font-family:Baskerville,'Baskerville Old Face','Libre Baskerville',Georgia,serif;font-size:1.55rem;font-weight:400;font-style:normal;line-height:1.2;margin-bottom:4px;letter-spacing:.01em}
.work-title{font-family:Baskerville,'Baskerville Old Face','Libre Baskerville',Georgia,serif;font-size:1.35rem;font-style:italic;font-weight:400;color:#888;margin-bottom:18px}
.work-meta{font-size:13px;line-height:1.9;margin-bottom:6px;color:#888}
.sold-tag{color:#aaa;font-size:10px;letter-spacing:.06em;font-family:inherit}
.work-edition{display:flex;align-items:center;gap:6px;font-size:13px;color:#888;margin-top:2px;margin-bottom:24px}
.work-edition svg{opacity:.6}
.inq-btn{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;opacity:.65;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:Helvetica,Arial,sans-serif;color:var(--ink)}
.inq-btn:hover{opacity:1}
.work-img{max-width:480px;margin:0 auto}
.work-img img{width:100%;display:block}

/* INQUIRY MODAL */
.inq-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease}
.inq-modal{background:#fff;width:90%;max-width:560px;max-height:90vh;overflow-y:auto;padding:40px;position:relative}
.inq-close{position:absolute;top:16px;right:20px;font-size:18px;cursor:pointer;opacity:.4;background:none;border:none;font-family:inherit;color:#111;line-height:1}
.inq-close:hover{opacity:1}
.inq-modal-header{display:flex;gap:20px;margin-bottom:32px;align-items:flex-start}
.inq-thumb{width:72px;flex-shrink:0}
.inq-thumb img{width:100%;display:block}
.inq-thumb-ph{width:72px;height:90px;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa;text-align:center;letter-spacing:.05em;text-transform:uppercase}
.inq-work-info{}
.inq-work-title{font-family:Baskerville,'Baskerville Old Face','Libre Baskerville',Georgia,serif;font-size:1.1rem;font-style:italic;color:#888;margin-bottom:4px}
.inq-work-meta{font-size:11px;color:#aaa;line-height:1.7}
.inq-form-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;color:#111}
.inq-field{margin-bottom:16px}
.inq-field label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#999;margin-bottom:5px}
.inq-field input,.inq-field textarea{width:100%;border:none;border-bottom:1px solid #ddd;padding:6px 0;font-size:13px;font-family:Helvetica,Arial,sans-serif;color:#111;outline:none;background:transparent;transition:border-color .2s}
.inq-field input:focus,.inq-field textarea:focus{border-bottom-color:#111}
.inq-field textarea{resize:vertical;min-height:90px}
.inq-submit{margin-top:28px;display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;font-family:Helvetica,Arial,sans-serif;color:#111;opacity:.65}
.inq-submit:hover{opacity:1}
@media(max-width:768px){.inq-modal{padding:28px 20px;width:95%}}

/* ABOUT */
.about-photo{margin-bottom:40px}
.about-photo img{width:100%;max-width:620px;display:block}
.about-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;opacity:1;color:#111}
.about-body{font-size:13.5px;line-height:1.75;max-width:60ch;margin-bottom:18px}

/* PRINTS INFO */
.prints-section{margin-bottom:32px}
.prints-feature{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.prints-feature li{font-size:13.5px;line-height:1.75;list-style:none;padding-left:14px;position:relative;max-width:60ch}
.prints-feature li::before{content:'·';position:absolute;left:0}
.paper-block{padding-top:14px;margin-bottom:14px;max-width:60ch}
.paper-name{font-size:13.5px;font-weight:700;margin-bottom:4px}
.paper-desc{font-size:13px;line-height:1.7}

/* CONTACT */
.contact-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;opacity:1;color:#111}
.contact-block{margin-bottom:36px}
.contact-block p{font-size:13.5px;line-height:1.9}
.contact-block a{display:block;font-size:13.5px;line-height:2}

/* UNFORGETTABLE INTRO */
.unf-intro{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:100vh;align-items:stretch}
.unf-intro-text{padding:28px 48px 80px;display:flex;flex-direction:column;justify-content:flex-start}
.unf-intro-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#aaa;margin-bottom:28px}
.unf-intro-h{margin-bottom:28px}
.unf-intro-h-main{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.8rem;font-weight:700;font-style:normal;line-height:1;letter-spacing:-.01em;display:block}
.unf-intro-h-sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:1rem;font-weight:600;font-style:normal;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;color:#111;display:block;margin-top:10px}
.unf-intro-body{font-size:13.5px;line-height:1.8;max-width:42ch;color:#555;margin-bottom:40px}
.unf-enter-btn{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:3px;cursor:pointer;color:#111;opacity:.7;background:none;border-left:none;border-right:none;border-top:none;font-family:Helvetica,Arial,sans-serif;transition:opacity .2s}
.unf-enter-btn:hover{opacity:1}
.unf-intro-img{position:relative;overflow:hidden;cursor:pointer}
.unf-intro-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.unf-intro-img:hover img{transform:scale(1.02)}
.unf-intro-img::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .4s ease;pointer-events:none}
.unf-intro-img:hover::after{background:rgba(0,0,0,0.18)}
@media(max-width:768px){
  .unf-intro{grid-template-columns:1fr;min-height:auto}
  .unf-intro-text{padding:32px 20px 36px}
  .unf-intro-img{height:60vw}
}


/* LANG TOGGLE */
.lang-toggle{display:flex;gap:4px;align-items:center;font-size:9px;letter-spacing:.06em;margin-bottom:16px}
.lang-toggle button{background:none;border:none;padding:0;font-size:9px;letter-spacing:.06em;cursor:pointer;color:var(--ink);opacity:.35;font-family:Helvetica,Arial,sans-serif}
.lang-toggle button.lang-active{opacity:1;font-weight:700}
.lang-toggle button:hover{opacity:.7}
.lang-toggle span{opacity:.25}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}
  .left{height:auto;padding:16px 20px 10px;flex-direction:column;gap:0;overflow:hidden;flex-shrink:0}
  .right{height:100%;overflow-y:auto}

  .artist{order:0;font-size:1.4rem;padding-top:0;margin-top:0;margin-bottom:4px}
  .lang-toggle{order:1;margin-bottom:8px}
  .ann{order:3}

  /* Nav en fila horizontal, permite wrap para que el submenu caiga limpio */
  .nav{flex-direction:row;align-items:baseline;gap:16px;margin-bottom:0;flex-wrap:wrap}
  .nav > a{font-size:12px;line-height:1.6}


  .ann{display:none}
  .works-grid{grid-template-columns:1fr 1fr;gap:48px 24px;padding:32px 20px}
  .content{padding:16px 16px 48px}
  .work-nav{flex-direction:column;gap:12px;align-items:flex-start}
  .work-nav-group{gap:20px}
}
</style>

let lang = localStorage.getItem('lang') || 'en';

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  // Toggle button states
  document.getElementById('btn-en').classList.toggle('lang-active', l === 'en');
  document.getElementById('btn-es').classList.toggle('lang-active', l === 'es');
  // Update static nav elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[l][key] !== undefined) el.textContent = T[l][key];
  });
  // Re-render current page
  render();
}

function t(key) {
  return T[lang][key] || T['en'][key] || key;
}

function openInquiry(series, idx) {
  var work = series === 'works' ? WORKS[idx] : series === 'unforgettable' ? UNFORGETTABLE[idx] : LIGHT_TEST[idx];
  if (!work) return;

  window._inqWork = work;

  var existing = document.getElementById('inq-overlay');
  if (existing) existing.remove();

  var isEs = lang === 'es';

  var overlay = document.createElement('div');
  overlay.className = 'inq-overlay';
  overlay.id = 'inq-overlay';

  var modal = document.createElement('div');
  modal.className = 'inq-modal';

  // Close button
  var closeBtn = document.createElement('button');
  closeBtn.className = 'inq-close';
  closeBtn.innerHTML = '&#x2715;';
  closeBtn.onclick = closeInquiry;
  modal.appendChild(closeBtn);

  // Header: thumb + info
  var header = document.createElement('div');
  header.className = 'inq-modal-header';

  var thumbDiv = document.createElement('div');
  thumbDiv.className = 'inq-thumb';
  var img = document.createElement('img');
  img.src = work.src;
  img.alt = work.title;
  img.onerror = function() { thumbDiv.innerHTML = '<div class="inq-thumb-ph">' + work.title + '</div>'; };
  thumbDiv.appendChild(img);
  header.appendChild(thumbDiv);

  var infoDiv = document.createElement('div');
  infoDiv.className = 'inq-work-info';
  infoDiv.innerHTML =
    '<div class="inq-work-title">' + work.title + '</div>' +
    '<div class="inq-work-meta">' +
      work.year + (work.sold ? ' · SOLD' : '') + '<br>' +
      work.material + '<br>' +
      work.size + ' / ' + work.sizeCm +
    '</div>';
  header.appendChild(infoDiv);
  modal.appendChild(header);

  // Form title
  var formH = document.createElement('div');
  formH.className = 'inq-form-h';
  formH.textContent = isEs ? 'Datos de contacto' : 'Contact details';
  modal.appendChild(formH);

  function makeField(labelText, inputType, inputId, ph) {
    var field = document.createElement('div');
    field.className = 'inq-field';
    var lbl = document.createElement('label');
    lbl.textContent = labelText;
    field.appendChild(lbl);
    var inp = inputType === 'textarea' ? document.createElement('textarea') : document.createElement('input');
    if (inputType !== 'textarea') inp.type = inputType;
    inp.id = inputId;
    inp.placeholder = ph;
    field.appendChild(inp);
    return field;
  }

  modal.appendChild(makeField(isEs ? 'Nombre completo' : 'Full name', 'text', 'inq-name', isEs ? 'Tu nombre' : 'Your name'));
  modal.appendChild(makeField(isEs ? 'Teléfono' : 'Phone', 'tel', 'inq-phone', isEs ? 'Tu número' : 'Your number'));
  modal.appendChild(makeField(isEs ? 'Dirección' : 'Address', 'text', 'inq-address', isEs ? 'Ciudad, país' : 'City, country'));
  modal.appendChild(makeField(isEs ? 'Mensaje' : 'Message', 'textarea', 'inq-message', isEs ? 'Escribe tu consulta...' : 'Write your inquiry...'));

  var submitBtn = document.createElement('button');
  submitBtn.className = 'inq-submit';
  submitBtn.textContent = isEs ? 'Enviar consulta' : 'Send inquiry';
  submitBtn.onclick = submitInquiry;
  modal.appendChild(submitBtn);

  overlay.appendChild(modal);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeInquiry();
  });

  document._inqKeyHandler = function(e) { if (e.key === 'Escape') closeInquiry(); };
  document.addEventListener('keydown', document._inqKeyHandler);

  document.body.appendChild(overlay);
}

function closeInquiry() {
  const overlay = document.getElementById('inq-overlay');
  if (overlay) overlay.remove();
  if (document._inqKeyHandler) {
    document.removeEventListener('keydown', document._inqKeyHandler);
    delete document._inqKeyHandler;
  }
}

function submitInquiry() {
  var work = window._inqWork;
  if (!work) return;

  var name    = document.getElementById('inq-name').value.trim();
  var phone   = document.getElementById('inq-phone').value.trim();
  var address = document.getElementById('inq-address').value.trim();
  var message = document.getElementById('inq-message').value.trim();

  if (!name) {
    alert(lang === 'es' ? 'Por favor ingresa tu nombre.' : 'Please enter your name.');
    return;
  }

  var submitBtn = document.querySelector('.inq-submit');
  submitBtn.disabled = true;
  submitBtn.textContent = lang === 'es' ? 'Enviando...' : 'Sending...';

  var payload = {
    name: name,
    phone: phone || '—',
    address: address || '—',
    message: message || '—',
    _subject: 'Inquiry: ' + work.title,
    work_title: work.title,
    work_year: work.year,
    work_material: work.material,
    work_size: work.size + ' / ' + work.sizeCm
  };

  fetch('https://formspree.io/f/xaqzkyor', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (data.ok) {
      // Show success message inside modal
      var modal = document.querySelector('.inq-modal');
      modal.innerHTML =
        '<div style="padding:40px 0;text-align:center;">' +
          '<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;color:#111;">' +
            (lang === 'es' ? 'Mensaje enviado' : 'Message sent') +
          '</div>' +
          '<div style="font-size:13px;color:#888;line-height:1.8;max-width:36ch;margin:0 auto;">' +
            (lang === 'es'
              ? 'Tu consulta sobre <em>' + work.title + '</em> ha sido recibida. Me pondré en contacto contigo pronto.'
              : "Your inquiry about <em>" + work.title + "</em> has been received. I'll be in touch shortly.") +
          '</div>' +
          '<button class="inq-close" onclick="closeInquiry()" style="position:static;display:inline-block;margin-top:32px;opacity:.5;">✕</button>' +
        '</div>';
    } else {
      submitBtn.disabled = false;
      submitBtn.textContent = lang === 'es' ? 'Enviar consulta' : 'Send inquiry';
      alert(lang === 'es' ? 'Error al enviar. Intenta de nuevo.' : 'Error sending. Please try again.');
    }
  })
  .catch(function() {
    submitBtn.disabled = false;
    submitBtn.textContent = lang === 'es' ? 'Enviar consulta' : 'Send inquiry';
    alert(lang === 'es' ? 'Error de conexión. Intenta de nuevo.' : 'Connection error. Please try again.');
  });
}
</script>
</body>
</html>
