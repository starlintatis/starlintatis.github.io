<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Starlin Tatis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--bg:#fff;--lw:290px;--serif:'Cormorant Garamond',Georgia,serif}
body{font-family:Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden}
a{text-decoration:none;color:var(--ink);cursor:pointer}
a:hover{opacity:0.45}

.shell{display:grid;grid-template-columns:var(--lw) 1fr;height:100vh}

/* LEFT SIDEBAR — fixed, never scrolls */
.left{padding:28px;display:flex;flex-direction:column;height:100vh;overflow:hidden;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:28px}
.nav a{font-size:13px;line-height:2.1;font-weight:400}
.nav a.active{font-weight:700}
.ann{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.55;opacity:.5}
.artist{order:99;margin-top:auto;font-size:2rem;font-weight:700;line-height:1.05;letter-spacing:-0.02em;padding-top:24px;cursor:pointer}

/* RIGHT — this column scrolls */
.right{height:100vh;overflow-y:auto}
.right-inner{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* CONTENT pages */
.content{padding:32px 40px 80px}
.page-title{font-size:1.1rem;font-weight:400;margin-bottom:36px;letter-spacing:.01em}

/* WORKS grid — hover effect mejorado */
.works-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;padding:32px}
.work-item{display:block;background:#fff;cursor:pointer;overflow:hidden}
.work-item img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center top;display:block;background:#f2f2f2;transition:filter .4s ease, transform .4s ease;filter:brightness(1)}
.work-item:hover img{filter:brightness(0.75);transform:scale(1.03)}
.wg-ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.25);letter-spacing:.08em;text-transform:uppercase;padding:8px;text-align:center}

/* WORK DETAIL — navegación con fuente más pequeña */
.work-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;padding-bottom:16px;border-bottom:1px solid #eee}
.work-nav-group{display:flex;gap:28px}
.work-nav a{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:400;color:#999;transition:color .2s ease}
.work-nav a:hover{color:#111;opacity:1}
.work-nav .nav-prev, .work-nav .nav-next{font-size:10px}
.work-artist{font-family:Baskerville,'Baskerville Old Face','Libre Baskerville',Georgia,serif;font-size:1.55rem;font-weight:400;font-style:normal;line-height:1.2;margin-bottom:4px;letter-spacing:.01em}
.work-title{font-family:Baskerville,'Baskerville Old Face','Libre Baskerville',Georgia,serif;font-size:1.35rem;font-style:italic;font-weight:400;color:#888;margin-bottom:18px}
.work-meta{font-size:13px;line-height:1.9;margin-bottom:6px;color:#888}
.work-edition{display:flex;align-items:center;gap:6px;font-size:13px;color:#888;margin-top:2px;margin-bottom:24px}
.work-edition svg{opacity:.6}
.inq-btn{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px;opacity:.65}
.inq-btn:hover{opacity:1}
.work-img{max-width:480px;margin:0 auto}
.work-img img{width:100%;display:block}

/* ABOUT */
.about-photo{margin-bottom:40px}
.about-photo img{width:100%;max-width:620px;display:block}
.about-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;opacity:1;color:#111}
.about-body{font-size:13.5px;line-height:1.75;max-width:60ch;margin-bottom:18px}

/* PRINTS INFO */
.prints-section{margin-bottom:32px}
.prints-feature{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.prints-feature li{font-size:13.5px;line-height:1.75;list-style:none;padding-left:14px;position:relative;max-width:60ch}
.prints-feature li::before{content:'·';position:absolute;left:0}
.paper-block{padding-top:14px;margin-bottom:14px;max-width:60ch}
.paper-name{font-size:13.5px;font-weight:700;margin-bottom:4px}
.paper-desc{font-size:13px;line-height:1.7}

/* CONTACT */
.contact-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px;opacity:1;color:#111}
.contact-block{margin-bottom:36px}
.contact-block p{font-size:13.5px;line-height:1.9}
.contact-block a{display:block;font-size:13.5px;line-height:2}

/* SUBMENU — accordion Prints */
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-parent{font-size:13px;line-height:2.1;font-weight:400;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
.nav-parent:hover{opacity:0.45}
.nav-parent.active{font-weight:700}
.nav-arrow{font-size:9px;opacity:.45;transition:transform .2s ease;display:inline-block}
.nav-group.open .nav-arrow{transform:rotate(90deg)}
.nav-sub{display:none;flex-direction:column;gap:1px;padding-left:12px}
.nav-group.open .nav-sub{display:flex}
.nav-sub a{font-size:12px;line-height:2.1;font-weight:400;opacity:.7}
.nav-sub a.active{font-weight:700;opacity:1}
.nav-sub a:hover{opacity:0.45}

/* LANG TOGGLE */
.lang-toggle{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.08em;margin-bottom:16px}
.lang-toggle button{background:none;border:none;padding:0;font-size:11px;letter-spacing:.08em;cursor:pointer;color:var(--ink);opacity:.35;font-family:Helvetica,Arial,sans-serif}
.lang-toggle button.lang-active{opacity:1;font-weight:700}
.lang-toggle button:hover{opacity:.7}
.lang-toggle span{opacity:.25}

/* RESPONSIVE */
@media(max-width:768px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh}
  .left{height:auto;padding:16px 20px 12px;flex-direction:column;gap:10px;overflow:hidden;flex-shrink:0}
  .right{height:100%;overflow-y:auto}
  .nav{order:1;flex-direction:row;gap:16px;margin-bottom:0;flex-wrap:wrap}
  .nav a{font-size:12px;line-height:1.6}
  .ann{display:none}
  .artist{order:0;font-size:1.4rem;padding-top:0;margin-top:0}
  .works-grid{grid-template-columns:repeat(2,1fr);gap:24px;padding:20px}
  .content{padding:16px 16px 48px}
  .work-nav{flex-direction:column;gap:12px;align-items:flex-start}
  .work-nav-group{gap:20px}
}
</style>
</head>

</div>

let lang = localStorage.getItem('lang') || 'en';

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  // Toggle button states
  document.getElementById('btn-en').classList.toggle('lang-active', l === 'en');
  document.getElementById('btn-es').classList.toggle('lang-active', l === 'es');
  // Update static nav elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[l][key] !== undefined) el.textContent = T[l][key];
  });
  // Re-render current page
  render();
}

function t(key) {
  return T[lang][key] || T['en'][key] || key;
}

// ============================================================
let state = { page: 'works', workIdx: null };

function enterSite() {
  const splash = document.getElementById('splash');
  splash.style.opacity = '0';
  splash.style.pointerEvents = 'none';
  setTimeout(() => splash.style.display = 'none', 650);
}

function go(page, idx) {
  state = { page, workIdx: (page === 'work-detail' || page === 'light-test-detail') ? idx : null };
  render();
  document.getElementById('right').scrollTo(0, 0);
}

function togglePrints() {
  const grp = document.getElementById('nav-prints-group');
  grp.classList.toggle('open');
}

function setActive(p) {
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.p === p);
  });
  // Auto-open accordion when a sub-page is active
  const subPages = ['works','work-detail','light-test','light-test-detail'];
  const grp = document.getElementById('nav-prints-group');
  if (grp) {
    if (subPages.includes(p)) grp.classList.add('open');
  }
  // Mark parent as active when any child is active
  const parent = document.querySelector('.nav-parent');
  if (parent) parent.classList.toggle('active', subPages.includes(p));
}

function render() {
  const R = document.getElementById('right');
  const { page, workIdx } = state;

  // WORKS LIST
  if (page === 'works') {
    setActive('works');
    const grid = WORKS.map((w, i) => `
      <div class="work-item" onclick="go('work-detail',${i})">
        <img src="${w.src}" alt="${w.title}"
          onerror="this.outerHTML='<div class=wg-ph>${w.title}</div>'"/>
      </div>`
    ).join('');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="works-grid">${grid}</div>
      </div>
      </div>`;
    return;
  }

  // WORK DETAIL — navegación mejorada
  if (page === 'work-detail') {
    setActive('works');
    const i = workIdx !== null ? workIdx : 0;
    const w = WORKS[i] || WORKS[0];
    const prev = i > 0 ? i - 1 : null;
    const next = i < WORKS.length - 1 ? i + 1 : null;
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="work-nav">
          <div class="work-nav-group">
            ${prev !== null ? `<a class="nav-prev" onclick="go('work-detail',${prev})">← ${t('prev_work')}</a>` : '<span style="opacity:0;visibility:hidden">← Previous</span>'}
            <a onclick="go('works')">${t('all_works')}</a>
            ${next !== null ? `<a class="nav-next" onclick="go('work-detail',${next})">${t('next_work')} →</a>` : '<span style="opacity:0;visibility:hidden">Next →</span>'}
          </div>
        </div>
        <div class="work-img">
          <img src="${w.src}" alt="${w.title}"/>
        </div>
        <div style="margin-top:24px">
          <div class="work-artist">Starlin Tatis</div>
          <div class="work-title">${w.title}</div>
          <div class="work-meta">
            ${w.year}<br>
            ${w.material}<br>
            ${w.size} / ${w.sizeCm}
          </div>
          <div class="work-edition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="1"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg>
            ${t('ltd_edition')}
          </div>
          <a class="inq-btn" href="mailto:starlintatis@gmail.com?subject=Inquiry: ${w.title}">${t('inquiries')}</a>
        </div>
      </div>
      </div>`;
    return;
  }

  // LIGHT TEST LIST
  if (page === 'light-test') {
    setActive('light-test');
    const grid = LIGHT_TEST.map((w, i) => `
      <div class="work-item" onclick="go('light-test-detail',${i})">
        <img src="${w.src}" alt="${w.title}"
          onerror="this.outerHTML='<div class=wg-ph>${w.title}</div>'"/>
      </div>`
    ).join('');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="works-grid">${grid}</div>
      </div>
      </div>`;
    return;
  }

  // LIGHT TEST DETAIL
  if (page === 'light-test-detail') {
    setActive('light-test');
    const i = workIdx !== null ? workIdx : 0;
    const w = LIGHT_TEST[i] || LIGHT_TEST[0];
    const prev = i > 0 ? i - 1 : null;
    const next = i < LIGHT_TEST.length - 1 ? i + 1 : null;
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="work-nav">
          <div class="work-nav-group">
            ${prev !== null ? `<a class="nav-prev" onclick="go('light-test-detail',${prev})">← ${t('prev_test')}</a>` : '<span style="opacity:0;visibility:hidden">← Previous</span>'}
            <a onclick="go('light-test')">${t('all_tests')}</a>
            ${next !== null ? `<a class="nav-next" onclick="go('light-test-detail',${next})">${t('next_test')} →</a>` : '<span style="opacity:0;visibility:hidden">Next →</span>'}
          </div>
        </div>
        <div class="work-img">
          <img src="${w.src}" alt="${w.title}"/>
        </div>
        <div style="margin-top:24px">
          <div class="work-artist">Starlin Tatis</div>
          <div class="work-title">${w.title}</div>
          <div class="work-meta">
            ${w.year}<br>
            ${w.material}<br>
            ${w.size} / ${w.sizeCm}
          </div>
          <div class="work-edition">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="1"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg>
            ${t('ltd_edition')}
          </div>
          <a class="inq-btn" href="mailto:starlintatis@gmail.com?subject=Inquiry: ${w.title}">${t('inquiries')}</a>
        </div>
      </div>
      </div>`;
    return;
  }

  // ABOUT
  if (page === 'about') {
    setActive('about');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="about-photo">
          <img src="images/about.jpg" alt="Starlin Tatis"
            onerror="this.parentNode.style.display='none'"/>
        </div>
        <div class="about-h">${t('about_h')}</div>
        <p class="about-body">${t('about_p1')}</p>
        <p class="about-body">${t('about_p2')}</p>
        <p class="about-body">${t('about_p3')}</p>
      </div>
      </div>`;
    return;
  }

  // PRINTS INFO
  if (page === 'editions') {
    setActive('editions');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="prints-section">
          <div class="about-h">${t('prints_h')}</div>
          <p class="about-body">${t('prints_p1')}</p>
          <p class="about-body">${t('prints_p2')}</p>
          <p class="about-body">${t('prints_p3')}</p>
          <p class="about-body" style="margin-top:18px">${t('prints_p4')}</p>
          <p class="about-body">${t('prints_p5')}</p>
        </div>

        <div class="prints-section">
          <div class="about-h">${t('orders_h')}</div>
          <p class="about-body">${t('orders_p1')}</p>
          <p class="about-body">${t('orders_p2')}</p>
          <p class="about-body">${t('orders_p3')}</p>
        </div>
      </div>
      </div>`;
    return;
  }

  // CONTACT
  if (page === 'contact') {
    setActive('contact');
    const socialHtml = CONTACT.social.map(s =>
      `<a href="${s.link}" style="font-weight:700">${s.name}</a>`).join('');
    R.innerHTML = `
      <div class="right-inner">
      <div class="content">
        <div class="contact-block">
          <div class="contact-h">${t('contact_h')}</div>
          <p class="about-body" style="margin-bottom:8px">${t('contact_note')}</p>
          <a href="mailto:${CONTACT.email}" style="text-decoration:underline">${CONTACT.email}</a>
        </div>
        <div class="contact-block">
          <div class="contact-h">${t('location_h')}</div>
          <p>${CONTACT.location}</p>
        </div>
        ${CONTACT.social.length ? `
        <div class="contact-block">
          <div class="contact-h">${t('social_h')}</div>
          ${socialHtml}
        </div>` : ''}
      </div>
      </div>`;
    return;
  }
}

// Apply saved language on load, then render
setLang(lang);
</script>
</body>
</html>
