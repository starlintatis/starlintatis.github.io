<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starlin Tatis - Fotógrafo</title>
  <meta name="description" content="Starlin Tatis. Photographer. Santo Domingo, Dominican Republic." />
  <style>
    :root {
      --background: rgb(249, 248, 246);
      --text: rgb(47, 44, 40);
      --muted: rgb(112, 109, 103);
      --ease: cubic-bezier(.5, 0, .15, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button, a {
      color: inherit;
      font: inherit;
    }

    .site-header {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 24px;
      display: flex;
      gap: 12px;
      width: calc(16.6667% - 16px);
      transform: translateY(-50%);
    }

    .site-name,
    .navigation {
      width: 100%;
      white-space: nowrap;
    }

    .site-name {
      font-size: 1.2rem;
      font-weight: 400;
      letter-spacing: 0;
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
    }

    .menu-button {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-style: italic;
      font-size: 16px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .navigation {
      display: grid;
      gap: 3px;
      max-height: 0;
      margin-top: 19px;
      overflow: hidden;
      opacity: 0;
      filter: blur(2px);
      transition: max-height .5s var(--ease), opacity .4s var(--ease), filter .4s var(--ease);
    }

    .navigation.is-open {
      max-height: 200px;
      opacity: 1;
      filter: none;
    }

    .navigation a {
      cursor: pointer;
      text-decoration: none;
      font-size: 16px;
      line-height: 1.5;
      font-family: Georgia, "Times New Roman", serif;
    }

    .navigation a:not(:first-child) {
      opacity: .5;
    }

    .navigation a.active {
      opacity: 1 !important;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      width: 100%;
      min-height: 100svh;
      padding: 24px;
    }

    .artwork-frame {
      grid-column: 4 / 10;
      display: grid;
      place-items: center;
      min-height: calc(100svh - 48px);
    }

    .artwork-image {
      display: block;
      width: 100%;
      max-height: calc(100svh - 144px);
      object-fit: contain;
      animation: fade-in .45s var(--ease);
    }

    .gallery-control {
      position: fixed;
      z-index: 3;
      top: 0;
      bottom: 0;
      width: 25vw;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .gallery-control:hover {
      background: rgba(47, 44, 40, .015);
    }

    .previous {
      left: 0;
      cursor: w-resize;
    }

    .next {
      right: 0;
      cursor: e-resize;
    }

    .artwork-details {
      position: fixed;
      z-index: 4;
      top: 50%;
      right: calc(8.3333% - 8px);
      width: calc(8.3333% - 12px);
      transform: translateY(-50%);
    }

    .artwork-details h1,
    .artwork-details p {
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.2;
    }

    .artwork-details h1 {
      margin-bottom: 12px;
      font-style: italic;
      color: var(--muted);
    }

    .artwork-details .sold {
      color: var(--muted);
      font-style: italic;
    }

    .counter {
      position: fixed;
      right: 24px;
      bottom: 50%;
      z-index: 4;
      font-style: italic;
    }

    .lang-toggle {
      position: fixed;
      z-index: 10;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      letter-spacing: .06em;
    }

    .lang-toggle button {
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      letter-spacing: .06em;
      cursor: pointer;
      color: var(--text);
      opacity: .35;
      font-family: Georgia, "Times New Roman", serif;
    }

    .lang-toggle button.lang-active {
      opacity: 1;
      font-weight: 700;
    }

    .lang-toggle button:hover {
      opacity: .7;
    }

    .lang-toggle span {
      opacity: .25;
    }

    /* ===== ABOUT / CONTACT ===== */
    .info-page {
      padding: 40px 60px 80px;
      max-width: 700px;
      margin: 0 auto;
      font-family: Georgia, "Times New Roman", serif;
    }

    .info-page .page-title {
      font-size: 1.1rem;
      font-weight: 400;
      margin-bottom: 36px;
      letter-spacing: .01em;
    }

    .info-page .about-body {
      font-size: 15px;
      line-height: 1.75;
      margin-bottom: 20px;
      color: var(--text);
    }

    .info-page .about-body a {
      text-decoration: underline;
    }

    .info-page .contact-block {
      margin-bottom: 36px;
    }

    .info-page .contact-block p {
      font-size: 15px;
      line-height: 1.9;
      margin-bottom: 6px;
    }

    .info-page .contact-block a {
      display: block;
      font-size: 15px;
      line-height: 2;
      text-decoration: underline;
    }

    .info-page .contact-h,
    .info-page .about-h {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin: 0 0 14px;
      color: var(--text);
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1550px) {
      .site-header { width: calc(33.3333% - 24px); }
      .artwork-frame { grid-column: 5 / 9; }
      .artwork-details { right: calc(16.6667% - 16px); width: calc(16.6667% - 24px); }
    }

    @media (max-width: 1000px) {
      .artwork-frame { grid-column: 3 / 11; }
      .artwork-details {
        top: auto;
        right: auto;
        bottom: 24px;
        left: 24px;
        width: calc(50% - 24px);
        transform: none;
      }
      .counter {
        right: 24px;
        bottom: 24px;
      }
      .lang-toggle {
        bottom: 24px;
        left: 24px;
      }
      .info-page {
        padding: 30px 24px 80px;
      }
    }

    @media (max-width: 650px) {
      .site-header {
        top: 12px;
        left: 12px;
        width: calc(100% - 24px);
        transform: none;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }

      .site-name {
        font-size: 1rem;
        width: auto;
        flex-shrink: 0;
      }

      .menu-button {
        font-size: 14px;
      }

      .navigation a {
        font-size: 14px;
      }

      .gallery {
        gap: 12px;
        padding: 80px 12px 80px;
      }

      .artwork-frame {
        grid-column: 1 / 13;
        min-height: calc(100svh - 200px);
      }

      .artwork-image {
        max-height: calc(100svh - 220px);
      }

      .artwork-details {
        bottom: 12px;
        left: 12px;
        width: calc(100% - 72px);
      }

      .artwork-details h1,
      .artwork-details p {
        font-size: 13px;
      }

      .counter {
        right: 12px;
        bottom: 12px;
        font-size: 12px;
      }

      .gallery-control {
        width: 20vw;
      }

      .lang-toggle {
        bottom: 12px;
        left: 12px;
        font-size: 10px;
      }

      .info-page {
        padding: 20px 16px 60px;
      }

      .info-page .about-body {
        font-size: 13px;
        line-height: 1.7;
      }

      .info-page .contact-block p,
      .info-page .contact-block a {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-name" id="site-name">Starlin Tatis</div>

    <div>
      <button class="menu-button" id="menu-button" aria-expanded="false">
        Menu
      </button>

      <nav class="navigation" id="navigation"></nav>
    </div>
  </header>

  <div class="lang-toggle">
    <button id="btn-en" onclick="setLang('en')" class="lang-active">EN</button>
    <span>/</span>
    <button id="btn-es" onclick="setLang('es')">ES</button>
  </div>

  <main class="gallery" id="gallery">
    <button class="gallery-control previous" id="previous" aria-label="Obra anterior"></button>

    <div class="artwork-frame">
      <img class="artwork-image" id="artwork-image" src="" alt="" />
    </div>

    <button class="gallery-control next" id="next" aria-label="Siguiente obra"></button>
  </main>

  <section class="artwork-details" aria-live="polite">
    <h1 id="artwork-title"></h1>
    <p id="artwork-year"></p>
    <p id="artwork-material"></p>
    <p id="artwork-size"></p>
    <p id="artwork-status" class="sold" style="display:none;">Sold</p>
  </section>

  <p class="counter" id="counter"></p>

  <div id="info-container" style="display:none;"></div>

  <script>
    // ============================================================
    // LANG
    // ============================================================
    let lang = localStorage.getItem('lang') || 'en';

    const T = {
      en: {
        menu: 'Menu',
        close: 'Close',
        all: 'All',
        works: 'Works',
        mutacion: 'Mutación Obscura',
        about: 'About',
        contact: 'Contact',
        sold: 'Sold',
        about_h: 'About',
        about_p1: 'Starlin Tatis is a self-taught photographer and creative director based in Santo Domingo, Dominican Republic. A practice situated at the intersection of editorial portraiture and fashion photography since 2010, defined by a sustained attention to presence — the silence between subject and lens that transforms a photograph into something closer: a unique and memorable record.',
        about_p2: 'Without formal academic training in large part, a visual language was built through an unwavering commitment to the artist\'s craft, developing a practice grounded in formal precision and psychological depth — taking the performing arts as near-total inspiration in fashion. The aesthetic draws from traditions of artistic portraiture and the codes of contemporary fashion, shaped entirely by the discipline of observation and constant creation, rejecting spectacle in favor of stillness.',
        about_p3: 'His work has been exhibited at the TRImarchi Graphic Design Festival in Mar del Plata, Argentina, and Galería Espacio Falso in Santiago, Chile. Published in Inkult Magazine (Mexico City), BALAM Magazine (Buenos Aires), among others. Photographs are held in private collections across several continents.',
        contact_h: 'Contact',
        location_h: 'Location',
        social_h: 'Social',
        contact_note: 'For print inquiries, exhibition proposals, and editorial commissions.',
        email: 'starlintatis@gmail.com',
        location: 'Santo Domingo, Dominican Republic',
        instagram: 'Instagram',
        patreon: 'Patreon',
      },
      es: {
        menu: 'Menú',
        close: 'Cerrar',
        all: 'Todas',
        works: 'Works',
        mutacion: 'Mutación Obscura',
        about: 'Acerca de',
        contact: 'Contacto',
        sold: 'Vendido',
        about_h: 'Acerca de',
        about_p1: 'Starlin Tatis es un fotógrafo autodidacta y director creativo radicado en Santo Domingo, República Dominicana. Su práctica, situada en el cruce entre el retrato editorial y la fotografía de moda, desde 2010, viene definiéndose por una atención sostenida a la presencia, el silencio entre el sujeto y el lente que transforma una fotografía en algo más cercano, un registro único y memorable.',
        about_p2: 'Sin formación académica formal en gran porcentaje, construyó su lenguaje visual a través de un compromiso inquebrantable con el oficio del artista, desarrollando una práctica sustentada en la precisión formal y la profundidad psicológica; tomando las artes escénicas como casi su total inspiración en moda. Su estética bebe de las tradiciones del retrato artístico y los códigos de la moda contemporánea, moldeada enteramente por la disciplina de la observación y la creación constante, rechazando el espectáculo en favor de la quietud.',
        about_p3: 'Su obra ha sido expuesta en el TRImarchi Graphic Design Festival en Mar del Plata, Argentina, Galería Espacio Falso en Santiago de Chile. Ha sido publicada en Inkult Magazine (Ciudad de México), BALAM Magazine (Buenos Aires), entre otros. Sus fotografías forman parte de colecciones privadas en varios continentes.',
        contact_h: 'Contacto',
        location_h: 'Ubicación',
        social_h: 'Redes',
        contact_note: 'Para consultas sobre impresiones, propuestas de exposición y encargos editoriales.',
        email: 'starlintatis@gmail.com',
        location: 'Santo Domingo, República Dominicana',
        instagram: 'Instagram',
        patreon: 'Patreon',
      }
    };

    function t(key) {
      return T[lang][key] || T['en'][key] || key;
    }

    function setLang(l) {
      lang = l;
      localStorage.setItem('lang', l);
      document.getElementById('btn-en').classList.toggle('lang-active', l === 'en');
      document.getElementById('btn-es').classList.toggle('lang-active', l === 'es');
      updateMenuText();
      const current = document.querySelector('#navigation a.active');
      if (current) {
        const series = current.dataset.series;
        if (series === 'about' || series === 'contact') {
          renderInfoPage(series);
        } else {
          filterSeries(series);
        }
      } else {
        filterSeries('all');
      }
    }

    function updateMenuText() {
      const btn = document.getElementById('menu-button');
      const isOpen = document.getElementById('navigation').classList.contains('is-open');
      btn.textContent = isOpen ? t('close') : t('menu');
    }

    // ============================================================
    // DATOS — STARLIN TATIS
    // ============================================================
    const portfolio = {
      name: "Starlin Tatis",
      navigation: [
        { key: 'all', label: 'All' },
        { key: 'works', label: 'Works' },
        { key: 'mutacion', label: 'Mutación Obscura' },
        { key: 'about', label: 'About' },
        { key: 'contact', label: 'Contact' }
      ],
      artworks: [
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "11 × 17\" in / 27.94 × 43.18 cm", status: "Available", image: "Works/work01.jpg", series: "works" },
        { title: "Cigua", year: "2022", material: "Digital Gelatin Silver Print", size: "16 × 20\" in / 40.64 × 50.80 cm", status: "Available", image: "Works/work02.jpg", series: "works" },
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "11 × 17\" in / 27.94 × 43.18 cm", status: "Available", image: "Works/work03.jpg", series: "works" },
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "11 × 17\" in / 27.94 × 43.18 cm", status: "Available", image: "Works/work04.jpg", series: "works" },
        { title: "Ave del paraíso", year: "2013", material: "Digital Gelatin Silver Print", size: "12 × 16\" in / 30.48 × 40.64 cm", status: "Available", image: "Works/work05.jpg", series: "works" },
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "11 × 17\" in / 27.94 × 43.18 cm", status: "Available", image: "Works/work06.jpg", series: "works" },
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "16 × 24\" in / 40.64 × 60.96 cm", status: "Available", image: "Works/work07.jpg", series: "works" },
        { title: "Untitled", year: "2015", material: "Digital Gelatin Silver Print", size: "16 × 24\" in / 40.64 × 60.96 cm", status: "Available", image: "Works/work08.jpg", series: "works" },
        { title: "Untitled", year: "2015", material: "Digital Gelatin Silver Print", size: "12 × 18\" in / 30.48 × 45.72 cm", status: "Available", image: "Works/work09.jpg", series: "works" },
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "12 × 18\" in / 30.48 × 45.72 cm", status: "Available", image: "Works/work10.jpg", series: "works" },
        { title: "The Lovers", year: "2014", material: "Digital Gelatin Silver Print", size: "16 × 24\" in / 40.64 × 60.96 cm", status: "Available", image: "Works/work11.jpg", series: "works" },
        { title: "Untitled", year: "2022", material: "Pigment Print on Bamboo Baryta", size: "24 × 16\" in / 60.96 × 40.64 cm", status: "Available", image: "Works/work12.jpg", series: "works" },
        { title: "Untitled", year: "2023", material: "Digital Gelatin Silver Print", size: "16 × 24\" in / 40.64 × 60.96 cm", status: "Available", image: "Works/work13.jpg", series: "works" },
        { title: "Untitled", year: "2013", material: "Digital Gelatin Silver Print", size: "11 × 17\" in / 27.94 × 43.18 cm", status: "Available", image: "Works/work14.jpg", series: "works" },
        { title: "Untitled", year: "2026", material: "Pigment Print on Awagami Bamboo", size: "20 × 30\" in / 50.8 × 76.2 cm", status: "Available", image: "Mutacion/Untitled13.jpg", series: "mutacion" },
        { title: "Untitled", year: "2026", material: "Pigment Print on Awagami Bamboo", size: "20 × 30\" in / 50.8 × 76.2 cm", status: "Available", image: "Mutacion/Untitled14.jpg", series: "mutacion" },
        { title: "Untitled", year: "2026", material: "Pigment Print on Awagami Bamboo", size: "20 × 30\" in / 50.8 × 76.2 cm", status: "Available", image: "Mutacion/Untitled15.jpg", series: "mutacion" },
        { title: "Untitled", year: "2026", material: "Pigment Print on Awagami Bamboo", size: "20 × 30\" in / 50.8 × 76.2 cm", status: "Available", image: "Mutacion/Untitled16.jpg", series: "mutacion" }
      ]
    };

    // ============================================================
    // LÓGICA DE GALERÍA
    // ============================================================
    let activeIndex = 0;
    let touchStartY = null;
    let currentSeries = 'all';

    function getFilteredArtworks() {
      if (currentSeries === 'all') return portfolio.artworks;
      return portfolio.artworks.filter(w => w.series === currentSeries);
    }

    const elements = {
      siteName: document.querySelector("#site-name"),
      navigation: document.querySelector("#navigation"),
      menuButton: document.querySelector("#menu-button"),
      image: document.querySelector("#artwork-image"),
      title: document.querySelector("#artwork-title"),
      year: document.querySelector("#artwork-year"),
      material: document.querySelector("#artwork-material"),
      size: document.querySelector("#artwork-size"),
      status: document.querySelector("#artwork-status"),
      counter: document.querySelector("#counter"),
      gallery: document.querySelector("#gallery"),
      infoContainer: document.querySelector("#info-container")
    };

    function renderNavigation() {
      const navItems = portfolio.navigation.map(item => {
        const label = t(item.key) || t('nav_' + item.key) || item.label;
        return `<a href="#" data-series="${item.key}" onclick="navigateTo('${item.key}'); return false;">${label}</a>`;
      });
      elements.navigation.innerHTML = navItems.join('');
      updateActiveNav();
    }

    function updateActiveNav() {
      document.querySelectorAll('#navigation a').forEach(a => {
        const isActive = a.dataset.series === currentSeries;
        a.classList.toggle('active', isActive);
        a.style.opacity = isActive ? '1' : '0.5';
      });
    }

    // ============================================================
    // NAVEGAR — OCULTA DETALLES AL ENTRAR A ABOUT/CONTACT
    // ============================================================
    function navigateTo(series) {
      currentSeries = series;
      if (series === 'about' || series === 'contact') {
        elements.gallery.style.display = 'none';
        elements.infoContainer.style.display = 'block';
        // Ocultar detalles de la obra
        document.querySelector('.artwork-details').style.display = 'none';
        document.querySelector('.counter').style.display = 'none';
        renderInfoPage(series);
      } else {
        elements.gallery.style.display = 'grid';
        elements.infoContainer.style.display = 'none';
        // Mostrar detalles de la obra
        document.querySelector('.artwork-details').style.display = 'block';
        document.querySelector('.counter').style.display = 'block';
        activeIndex = 0;
        renderArtwork();
      }
      updateActiveNav();
      closeMenu();
    }

    function closeMenu() {
      const nav = document.getElementById('navigation');
      nav.classList.remove('is-open');
      document.getElementById('menu-button').textContent = t('menu');
      document.getElementById('menu-button').setAttribute('aria-expanded', 'false');
    }

    function filterSeries(series) {
      currentSeries = series;
      activeIndex = 0;
      updateActiveNav();
      renderArtwork();
      closeMenu();
    }

    function renderArtwork() {
      const filtered = getFilteredArtworks();
      if (filtered.length === 0) {
        elements.image.src = '';
        elements.image.alt = 'No works';
        elements.title.textContent = 'No works available';
        elements.year.textContent = '';
        elements.material.textContent = '';
        elements.size.textContent = '';
        elements.status.style.display = 'none';
        elements.counter.textContent = '0 / 0';
        return;
      }

      if (activeIndex >= filtered.length) activeIndex = 0;
      if (activeIndex < 0) activeIndex = filtered.length - 1;

      const art = filtered[activeIndex];

      elements.image.src = art.image;
      elements.image.alt = art.title;
      elements.title.textContent = art.title;
      elements.year.textContent = art.year;
      elements.material.textContent = art.material;
      elements.size.textContent = art.size;

      const isSold = art.status && art.status.toLowerCase() === 'sold';
      if (isSold) {
        elements.status.style.display = 'block';
        elements.status.textContent = t('sold');
      } else {
        elements.status.style.display = 'none';
      }

      elements.counter.textContent =
        `No. ${String(activeIndex + 1).padStart(2, "0")} of ${filtered.length}`;
    }

    function changeArtwork(direction) {
      const filtered = getFilteredArtworks();
      if (filtered.length === 0) return;
      activeIndex = (activeIndex + direction + filtered.length) % filtered.length;
      renderArtwork();
    }

    // ============================================================
    // INFO PAGE (ABOUT / CONTACT) — SIN IMAGEN
    // ============================================================
    function renderInfoPage(page) {
      const container = elements.infoContainer;
      if (page === 'about') {
        container.innerHTML = `
          <div class="info-page">
            <div class="about-h">${t('about_h')}</div>
            <p class="about-body">${t('about_p1')}</p>
            <p class="about-body">${t('about_p2')}</p>
            <p class="about-body">${t('about_p3')}</p>
          </div>
        `;
      } else if (page === 'contact') {
        container.innerHTML = `
          <div class="info-page">
            <div class="contact-block">
              <div class="contact-h">${t('contact_h')}</div>
              <p class="about-body" style="margin-bottom:8px">${t('contact_note')}</p>
              <a href="mailto:${t('email')}" style="text-decoration:underline">${t('email')}</a>
            </div>
            <div class="contact-block">
              <div class="contact-h">${t('location_h')}</div>
              <p class="about-body">${t('location')}</p>
            </div>
            <div class="contact-block">
              <div class="contact-h">${t('social_h')}</div>
              <a href="https://instagram.com/starlintatis" style="text-decoration:underline">${t('instagram')}</a>
              <a href="https://www.patreon.com/starlintatis" style="text-decoration:underline">${t('patreon')}</a>
            </div>
          </div>
        `;
      }
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    elements.siteName.textContent = portfolio.name;
    renderNavigation();
    navigateTo('all');

    document.querySelector("#next").addEventListener("click", () => changeArtwork(1));
    document.querySelector("#previous").addEventListener("click", () => changeArtwork(-1));

    elements.menuButton.addEventListener("click", () => {
      const isOpen = elements.navigation.classList.toggle("is-open");
      elements.menuButton.textContent = isOpen ? t('close') : t('menu');
      elements.menuButton.setAttribute("aria-expanded", String(isOpen));
    });

    elements.siteName.addEventListener("click", () => {
      navigateTo('all');
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "ArrowDown") changeArtwork(1);
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") changeArtwork(-1);
    });

    elements.gallery.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) > 20) changeArtwork(event.deltaY > 0 ? 1 : -1);
    });

    elements.gallery.addEventListener("touchstart", (event) => {
      touchStartY = event.changedTouches[0].clientY;
    });

    elements.gallery.addEventListener("touchend", (event) => {
      if (touchStartY === null) return;
      const movement = touchStartY - event.changedTouches[0].clientY;
      if (Math.abs(movement) > 40) changeArtwork(movement > 0 ? 1 : -1);
      touchStartY = null;
    });

    // ============================================================
    // LANG
    // ============================================================
    const originalSetLang = setLang;
    setLang = function(l) {
      originalSetLang(l);
      renderNavigation();
      updateMenuText();
      const current = document.querySelector('#navigation a.active');
      if (current) {
        const series = current.dataset.series;
        if (series === 'about' || series === 'contact') {
          renderInfoPage(series);
        } else {
          renderArtwork();
        }
      } else {
        renderArtwork();
      }
    };

    setLang(lang);
  </script>
</body>
</html>
