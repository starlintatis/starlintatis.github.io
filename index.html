<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starlin Tatis - Fotógrafo</title>
  <meta name="description" content="Starlin Tatis. Photographer. Santo Domingo, Dominican Republic." />
  <style>
    :root {
      --background: rgb(249, 248, 246);
      --text: rgb(47, 44, 40);
      --muted: rgb(112, 109, 103);
      --ease: cubic-bezier(.5, 0, .15, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    button, a {
      color: inherit;
      font: inherit;
    }

    .site-header {
      position: fixed;
      z-index: 10;
      top: 50%;
      left: 24px;
      display: flex;
      gap: 12px;
      width: calc(16.6667% - 16px);
      transform: translateY(-50%);
    }

    .site-name,
    .navigation {
      width: 100%;
      white-space: nowrap;
    }

    .site-name {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    .menu-button {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-style: italic;
    }

    .navigation {
      display: grid;
      gap: 3px;
      max-height: 0;
      margin-top: 19px;
      overflow: hidden;
      opacity: 0;
      filter: blur(2px);
      transition: max-height .5s var(--ease), opacity .4s var(--ease), filter .4s var(--ease);
    }

    .navigation.is-open {
      max-height: 200px;
      opacity: 1;
      filter: none;
    }

    .navigation a {
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      line-height: 1.6;
    }

    .navigation a:not(:first-child) {
      opacity: .5;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
      width: 100%;
      min-height: 100svh;
      padding: 24px;
    }

    .artwork-frame {
      grid-column: 4 / 10;
      display: grid;
      place-items: center;
      min-height: calc(100svh - 48px);
    }

    .artwork-image {
      display: block;
      width: 100%;
      max-height: calc(100svh - 144px);
      object-fit: contain;
      animation: fade-in .45s var(--ease);
    }

    .gallery-control {
      position: fixed;
      z-index: 3;
      top: 0;
      bottom: 0;
      width: 25vw;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .gallery-control:hover {
      background: rgba(47, 44, 40, .015);
    }

    .previous {
      left: 0;
      cursor: w-resize;
    }

    .next {
      right: 0;
      cursor: e-resize;
    }

    .artwork-details {
      position: fixed;
      z-index: 4;
      top: 50%;
      right: calc(8.3333% - 8px);
      width: calc(8.3333% - 12px);
      transform: translateY(-50%);
    }

    .artwork-details h1,
    .artwork-details p {
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.2;
    }

    .artwork-details h1 {
      margin-bottom: 12px;
      font-style: italic;
      color: var(--muted);
    }

    .artwork-details .sold {
      color: var(--muted);
      font-style: italic;
    }

    .counter {
      position: fixed;
      right: 24px;
      bottom: 50%;
      z-index: 4;
      font-style: italic;
    }

    .lang-toggle {
      position: fixed;
      z-index: 10;
      bottom: 24px;
      left: 24px;
      display: flex;
      gap: 4px;
      align-items: center;
      font-size: 11px;
      letter-spacing: .06em;
    }

    .lang-toggle button {
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      letter-spacing: .06em;
      cursor: pointer;
      color: var(--text);
      opacity: .35;
      font-family: inherit;
    }

    .lang-toggle button.lang-active {
      opacity: 1;
      font-weight: 700;
    }

    .lang-toggle button:hover {
      opacity: .7;
    }

    .lang-toggle span {
      opacity: .25;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 1550px) {
      .site-header { width: calc(33.3333% - 24px); }
      .artwork-frame { grid-column: 5 / 9; }
      .artwork-details { right: calc(16.6667% - 16px); width: calc(16.6667% - 24px); }
    }

    @media (max-width: 1000px) {
      .artwork-frame { grid-column: 3 / 11; }
      .artwork-details {
        top: auto;
        right: auto;
        bottom: 24px;
        left: 24px;
        width: calc(50% - 24px);
        transform: none;
      }
      .counter {
        right: 24px;
        bottom: 24px;
      }
      .lang-toggle {
        bottom: 24px;
        left: 24px;
      }
    }

    @media (max-width: 650px) {
      .site-header {
        top: 12px;
        left: 12px;
        width: calc(100% - 24px);
        transform: none;
      }

      .site-name {
        font-size: 1.1rem;
      }

      .gallery {
        gap: 12px;
        padding: 114px 12px;
      }

      .artwork-frame {
        grid-column: 1 / 13;
        min-height: calc(100svh - 228px);
      }

      .artwork-image {
        max-height: calc(100svh - 260px);
      }

      .artwork-details {
        bottom: 12px;
        left: 12px;
        width: calc(100% - 72px);
      }

      .artwork-details h1,
      .artwork-details p {
        font-size: 14px;
      }

      .counter {
        right: 12px;
        bottom: 12px;
      }

      .gallery-control {
        width: 20vw;
      }

      .lang-toggle {
        bottom: 12px;
        left: 12px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-name" id="site-name">Starlin Tatis</div>

    <div>
      <button class="menu-button" id="menu-button" aria-expanded="false">
        Menu
      </button>

      <nav class="navigation" id="navigation"></nav>
    </div>
  </header>

  <div class="lang-toggle">
    <button id="btn-en" onclick="setLang('en')" class="lang-active">EN</button>
    <span>/</span>
    <button id="btn-es" onclick="setLang('es')">ES</button>
  </div>

  <main class="gallery" id="gallery">
    <button class="gallery-control previous" id="previous" aria-label="Obra anterior"></button>

    <div class="artwork-frame">
      <img class="artwork-image" id="artwork-image" src="" alt="" />
    </div>

    <button class="gallery-control next" id="next" aria-label="Siguiente obra"></button>
  </main>

  <section class="artwork-details" aria-live="polite">
    <h1 id="artwork-title"></h1>
    <p id="artwork-year"></p>
    <p id="artwork-material"></p>
    <p id="artwork-size"></p>
    <p id="artwork-status" class="sold" style="display:none;">Sold</p>
  </section>

  <p class="counter" id="counter"></p>

  <script>
    // ============================================================
    // LANG
    // ============================================================
    let lang = localStorage.getItem('lang') || 'en';

    const T = {
      en: {
        menu: 'Menu',
        close: 'Close',
        works: 'Works',
        mutacion: 'Mutación Obscura',
        contact: 'Contact',
        inquiries: 'Inquiries',
        sold: 'Sold',
      },
      es: {
        menu: 'Menú',
        close: 'Cerrar',
        works: 'Works',
        mutacion: 'Mutación Obscura',
        contact: 'Contacto',
        inquiries: 'Consultas',
        sold: 'Vendido',
      }
    };

    function t(key) {
      return T[lang][key] || T['en'][key] || key;
    }

    function setLang(l) {
      lang = l;
      localStorage.setItem('lang', l);
      document.getElementById('btn-en').classList.toggle('lang-active', l === 'en');
      document.getElementById('btn-es').classList.toggle('lang-active', l === 'es');
      updateMenuText();
    }

    function updateMenuText() {
      const btn = document.getElementById('menu-button');
      const isOpen = document.getElementById('navigation').classList.contains('is-open');
      btn.textContent = isOpen ? t('close') : t('menu');
    }

    // ============================================================
    // DATOS — STARLIN TATIS
    // ============================================================
    const portfolio = {
      name: "Starlin Tatis",
      navigation: [
        { key: 'works', label: 'Works' },
        { key: 'mutacion', label: 'Mutación Obscura' },
        { key: 'contact', label: 'Contact' }
      ],
      artworks: [
        // WORKS (14 obras)
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "11 × 17\" in / 27.94 × 43.18 cm",
          status: "Available",
          image: "Works/work01.jpg",
          series: "works"
        },
        {
          title: "Cigua",
          year: "2022",
          material: "Digital Gelatin Silver Print",
          size: "16 × 20\" in / 40.64 × 50.80 cm",
          status: "Available",
          image: "Works/work02.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "11 × 17\" in / 27.94 × 43.18 cm",
          status: "Available",
          image: "Works/work03.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "11 × 17\" in / 27.94 × 43.18 cm",
          status: "Available",
          image: "Works/work04.jpg",
          series: "works"
        },
        {
          title: "Ave del paraíso",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "12 × 16\" in / 30.48 × 40.64 cm",
          status: "Available",
          image: "Works/work05.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "11 × 17\" in / 27.94 × 43.18 cm",
          status: "Available",
          image: "Works/work06.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "16 × 24\" in / 40.64 × 60.96 cm",
          status: "Available",
          image: "Works/work07.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2015",
          material: "Digital Gelatin Silver Print",
          size: "16 × 24\" in / 40.64 × 60.96 cm",
          status: "Available",
          image: "Works/work08.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2015",
          material: "Digital Gelatin Silver Print",
          size: "12 × 18\" in / 30.48 × 45.72 cm",
          status: "Available",
          image: "Works/work09.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "12 × 18\" in / 30.48 × 45.72 cm",
          status: "Available",
          image: "Works/work10.jpg",
          series: "works"
        },
        {
          title: "The Lovers",
          year: "2014",
          material: "Digital Gelatin Silver Print",
          size: "16 × 24\" in / 40.64 × 60.96 cm",
          status: "Available",
          image: "Works/work11.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2022",
          material: "Pigment Print on Bamboo Baryta",
          size: "24 × 16\" in / 60.96 × 40.64 cm",
          status: "Available",
          image: "Works/work12.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2023",
          material: "Digital Gelatin Silver Print",
          size: "16 × 24\" in / 40.64 × 60.96 cm",
          status: "Available",
          image: "Works/work13.jpg",
          series: "works"
        },
        {
          title: "Untitled",
          year: "2013",
          material: "Digital Gelatin Silver Print",
          size: "11 × 17\" in / 27.94 × 43.18 cm",
          status: "Available",
          image: "Works/work14.jpg",
          series: "works"
        },
        // MUTACIÓN (4 obras)
        {
          title: "Untitled",
          year: "2026",
          material: "Pigment Print on Awagami Bamboo",
          size: "20 × 30\" in / 50.8 × 76.2 cm",
          status: "Available",
          image: "Mutacion/Untitled13.jpg",
          series: "mutacion"
        },
        {
          title: "Untitled",
          year: "2026",
          material: "Pigment Print on Awagami Bamboo",
          size: "20 × 30\" in / 50.8 × 76.2 cm",
          status: "Available",
          image: "Mutacion/Untitled14.jpg",
          series: "mutacion"
        },
        {
          title: "Untitled",
          year: "2026",
          material: "Pigment Print on Awagami Bamboo",
          size: "20 × 30\" in / 50.8 × 76.2 cm",
          status: "Available",
          image: "Mutacion/Untitled15.jpg",
          series: "mutacion"
        },
        {
          title: "Untitled",
          year: "2026",
          material: "Pigment Print on Awagami Bamboo",
          size: "20 × 30\" in / 50.8 × 76.2 cm",
          status: "Available",
          image: "Mutacion/Untitled16.jpg",
          series: "mutacion"
        }
      ]
    };

    // ============================================================
    // LÓGICA DE GALERÍA
    // ============================================================
    let activeIndex = 0;
    let touchStartY = null;
    let currentSeries = 'all'; // 'all', 'works', 'mutacion'

    function getFilteredArtworks() {
      if (currentSeries === 'all') return portfolio.artworks;
      return portfolio.artworks.filter(w => w.series === currentSeries);
    }

    const elements = {
      siteName: document.querySelector("#site-name"),
      navigation: document.querySelector("#navigation"),
      menuButton: document.querySelector("#menu-button"),
      image: document.querySelector("#artwork-image"),
      title: document.querySelector("#artwork-title"),
      year: document.querySelector("#artwork-year"),
      material: document.querySelector("#artwork-material"),
      size: document.querySelector("#artwork-size"),
      status: document.querySelector("#artwork-status"),
      counter: document.querySelector("#counter"),
      gallery: document.querySelector("#gallery")
    };

    function renderNavigation() {
      const navItems = portfolio.navigation.map(item => {
        const label = t(item.key) || item.label;
        return `<a href="#" data-series="${item.key}" onclick="filterSeries('${item.key}'); return false;">${label}</a>`;
      });
      // Añadir "All works" al inicio
      const allWorks = `<a href="#" data-series="all" onclick="filterSeries('all'); return false;">${lang === 'es' ? 'Todas' : 'All'}</a>`;
      elements.navigation.innerHTML = allWorks + navItems.join('');
      // Actualizar active
      updateActiveNav();
    }

    function updateActiveNav() {
      document.querySelectorAll('#navigation a').forEach(a => {
        a.style.opacity = a.dataset.series === currentSeries ? '1' : '0.5';
      });
    }

    function filterSeries(series) {
      currentSeries = series;
      activeIndex = 0;
      updateActiveNav();
      renderArtwork();
      // Cerrar menú en móvil
      closeMenu();
    }

    function closeMenu() {
      const nav = document.getElementById('navigation');
      nav.classList.remove('is-open');
      document.getElementById('menu-button').textContent = t('menu');
      document.getElementById('menu-button').setAttribute('aria-expanded', 'false');
    }

    function renderArtwork() {
      const filtered = getFilteredArtworks();
      if (filtered.length === 0) {
        elements.image.src = '';
        elements.image.alt = 'No works';
        elements.title.textContent = 'No works available';
        elements.year.textContent = '';
        elements.material.textContent = '';
        elements.size.textContent = '';
        elements.status.style.display = 'none';
        elements.counter.textContent = '0 / 0';
        return;
      }

      if (activeIndex >= filtered.length) activeIndex = 0;
      if (activeIndex < 0) activeIndex = filtered.length - 1;

      const art = filtered[activeIndex];

      elements.image.src = art.image;
      elements.image.alt = art.title;
      elements.title.textContent = art.title;
      elements.year.textContent = art.year;
      elements.material.textContent = art.material;
      elements.size.textContent = art.size;

      const isSold = art.status && art.status.toLowerCase() === 'sold';
      if (isSold) {
        elements.status.style.display = 'block';
        elements.status.textContent = t('sold');
      } else {
        elements.status.style.display = 'none';
      }

      elements.counter.textContent =
        `No. ${String(activeIndex + 1).padStart(2, "0")} of ${filtered.length}`;
    }

    function changeArtwork(direction) {
      const filtered = getFilteredArtworks();
      if (filtered.length === 0) return;
      activeIndex = (activeIndex + direction + filtered.length) % filtered.length;
      renderArtwork();
    }

    // ============================================================
    // INICIALIZACIÓN
    // ============================================================
    elements.siteName.textContent = portfolio.name;
    renderNavigation();
    renderArtwork();

    // Eventos
    document.querySelector("#next").addEventListener("click", () => changeArtwork(1));
    document.querySelector("#previous").addEventListener("click", () => changeArtwork(-1));

    elements.menuButton.addEventListener("click", () => {
      const isOpen = elements.navigation.classList.toggle("is-open");
      elements.menuButton.textContent = isOpen ? t('close') : t('menu');
      elements.menuButton.setAttribute("aria-expanded", String(isOpen));
    });

    // Click en el nombre vuelve a "all"
    elements.siteName.addEventListener("click", () => {
      filterSeries('all');
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "ArrowDown") changeArtwork(1);
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") changeArtwork(-1);
    });

    elements.gallery.addEventListener("wheel", (event) => {
      if (Math.abs(event.deltaY) > 20) changeArtwork(event.deltaY > 0 ? 1 : -1);
    });

    elements.gallery.addEventListener("touchstart", (event) => {
      touchStartY = event.changedTouches[0].clientY;
    });

    elements.gallery.addEventListener("touchend", (event) => {
      if (touchStartY === null) return;

      const movement = touchStartY - event.changedTouches[0].clientY;
      if (Math.abs(movement) > 40) changeArtwork(movement > 0 ? 1 : -1);

      touchStartY = null;
    });

    // ============================================================
    // LANG — actualizar menú al cambiar idioma
    // ============================================================
    // Guardamos referencia a la función original de setLang
    const originalSetLang = setLang;
    setLang = function(l) {
      originalSetLang(l);
      renderNavigation();
      updateMenuText();
      // Actualizar título de la obra actual
      renderArtwork();
    };

    // Aplicar idioma guardado
    setLang(lang);
  </script>
</body>
</html>
